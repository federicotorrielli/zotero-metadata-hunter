<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <!-- Painted with context-fill so Zotero's theme colour reaches the icon.
       Hardcoding colours here does not work: an SVG referenced through the
       `image` attribute renders as its own document, where a
       prefers-color-scheme query cannot see Zotero's theme setting. -->
  <!-- Magnifying glass -->
  <circle cx="6.5" cy="6.5" r="4" fill="none" stroke="context-fill" stroke-width="1.5"/>
  <line x1="9.8" y1="9.8" x2="14" y2="14" stroke="context-fill" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Plus sign -->
  <line x1="12.5" y1="1.5" x2="12.5" y2="5.5" stroke="context-fill" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10.5" y1="3.5" x2="14.5" y2="3.5" stroke="context-fill" stroke-width="1.4" stroke-linecap="round"/>
</svg>
