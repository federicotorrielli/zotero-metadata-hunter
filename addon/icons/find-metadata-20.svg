<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none">
  <!-- 20px variant for the main toolbar, where Zotero draws every button icon
       at 20x20. The 16px file is for menus. See find-metadata.svg for why the
       paint is context-fill. -->
  <!-- Magnifying glass -->
  <circle cx="8" cy="8" r="5" fill="none" stroke="context-fill" stroke-width="1.8"/>
  <line x1="12" y1="12" x2="17" y2="17" stroke="context-fill" stroke-width="2" stroke-linecap="round"/>
  <!-- Plus sign -->
  <line x1="16" y1="2" x2="16" y2="7" stroke="context-fill" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13.5" y1="4.5" x2="18.5" y2="4.5" stroke="context-fill" stroke-width="1.6" stroke-linecap="round"/>
</svg>
